<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RDK Studio</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }

      :root {
        /* Warm near-black and ivory rather than blue-black and white: lower chroma
           reads calmer, and keeps the grey stimulus the most colourful thing on screen. */
        --bg: #0c0c0e;
        --panel: rgba(236, 231, 223, 0.028);
        --panel-hi: rgba(236, 231, 223, 0.055);
        --text: #ece7df;
        --muted: #a8a096;
        --faint: #776f66;
        --border: rgba(236, 231, 223, 0.10);
        --border-hi: rgba(236, 231, 223, 0.21);
        --accent: #d9b978;
        --accent-ink: #241c0c;
        --accent-soft: rgba(217, 185, 120, 0.12);
        --ok: #8fbf9f;
        --warn: #d9b978;
        --bad: #cf8b7d;
        --serif: ui-serif, "Iowan Old Style", Georgia, "Times New Roman", serif;
        --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
      }

      body {
        margin: 0;
        font-family: var(--sans);
        font-size: 15px;
        background:
          radial-gradient(1100px 540px at 12% -14%, rgba(217, 185, 120, 0.07), transparent 62%),
          radial-gradient(900px 460px at 92% -6%, rgba(236, 231, 223, 0.035), transparent 58%),
          var(--bg);
        background-attachment: fixed;
        color: var(--text);
        line-height: 1.58;
        -webkit-font-smoothing: antialiased;
      }

      /* ---------- menu bar ---------- */
      .appbar {
        position: sticky; top: 0; z-index: 40;
        display: flex; align-items: center; gap: 22px;
        padding: 0 24px; height: 64px;
        background: rgba(12, 12, 14, 0.86);
        backdrop-filter: saturate(150%) blur(14px);
        border-bottom: 1px solid var(--border);
      }
      .brand { display: flex; align-items: center; gap: 11px; flex: none; }
      .brand .mark {
        width: 20px; height: 20px; border-radius: 50%; flex: none;
        border: 1.5px solid var(--accent);
        box-shadow: inset 0 0 0 3.5px var(--bg), inset 0 0 0 5px rgba(217, 185, 120, 0.5);
      }
      .brand b {
        font-family: var(--serif); font-size: 19px; font-weight: 600;
        letter-spacing: 0.005em;
      }

      .tabs {
        display: flex; align-items: center; gap: 4px; flex: 1 1 auto;
        overflow-x: auto; scrollbar-width: none; padding: 4px;
      }
      .tabs::-webkit-scrollbar { display: none; }
      .tab {
        display: inline-flex; align-items: center; gap: 8px; flex: none;
        font: inherit; font-size: 14px; color: var(--muted);
        padding: 8px 14px; border-radius: 9px; border: 1px solid transparent;
        background: transparent; cursor: pointer; white-space: nowrap;
        transition: color .15s, background .15s, border-color .15s;
      }
      .tab:hover { color: var(--text); background: var(--panel-hi); }
      .tab[aria-selected="true"] {
        color: var(--text); background: var(--accent-soft);
        border-color: rgba(217, 185, 120, 0.4);
      }
      .tab .chip {
        font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .05em;
        padding: 2.5px 6px; border-radius: 5px;
        background: rgba(236, 231, 223, 0.09); color: var(--muted);
      }
      /* Our variants carry the accent; the canonical four stay neutral. */
      .tab.is-ours .chip { background: rgba(217, 185, 120, 0.18); color: var(--accent); }

      .bar-right { display: flex; align-items: center; gap: 11px; flex: none; }
      .pill {
        display: inline-flex; align-items: center; gap: 7px;
        font-size: 12.5px; color: var(--muted); padding: 6px 12px;
        border: 1px solid var(--border); border-radius: 999px; background: var(--panel);
      }
      .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); flex: none; }
      .pill[data-state="busy"] .dot { background: var(--warn); animation: pulse 1s ease-in-out infinite; }
      .pill[data-state="error"] .dot { background: var(--bad); }
      @keyframes pulse { 50% { opacity: .25; } }

      .icon-btn {
        display: inline-grid; place-content: center; width: 34px; height: 34px;
        font: inherit; font-size: 15px; color: var(--muted); cursor: pointer;
        border: 1px solid var(--border); border-radius: 9px; background: var(--panel);
        transition: color .15s, border-color .15s;
      }
      .icon-btn:hover { color: var(--accent); border-color: var(--border-hi); }

      /* ---------- layout ---------- */
      .wrap { max-width: 1400px; margin: 0 auto; padding: 24px 24px 72px; }
      .grid { display: grid; grid-template-columns: minmax(0, 440px) minmax(0, 1fr); gap: 22px; align-items: start; }
      @media (max-width: 1080px) { .grid { grid-template-columns: 1fr; } }

      .card {
        background: var(--panel); border: 1px solid var(--border);
        border-radius: 12px; padding: 22px;
      }
      .stack { display: grid; gap: 22px; position: sticky; top: 86px; }
      @media (max-width: 1080px) { .stack { position: static; } }

      .section-title {
        font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.13em;
        color: var(--faint); font-weight: 650; margin: 0 0 13px;
      }

      /* ---------- stage ---------- */
      .stage {
        display: grid; place-items: center; padding: 26px; border-radius: 10px;
        background: radial-gradient(circle at 50% 45%, rgba(236,231,223,0.04), transparent 70%), #08080a;
        border: 1px solid var(--border); min-height: 320px;
      }
      canvas {
        display: block; max-width: 100%; border-radius: 4px;
        image-rendering: pixelated;      /* never smear the stimulus when scaled up */
        box-shadow: 0 14px 44px rgba(0, 0, 0, 0.6);
      }

      .transport {
        display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
        margin-top: 16px;
      }
      .stats { font-family: var(--mono); font-size: 13px; color: var(--faint); }
      .stats b { color: var(--muted); font-weight: 500; }
      .grow { flex: 1 1 auto; }

      button.ghost, button.solid {
        font: inherit; font-size: 14px; cursor: pointer; border-radius: 9px;
        padding: 9px 16px; transition: filter .15s, border-color .15s, background .15s;
      }
      button.ghost {
        color: var(--text); background: var(--panel); border: 1px solid var(--border);
      }
      button.ghost:hover { border-color: var(--border-hi); background: var(--panel-hi); }
      button.solid {
        color: var(--accent-ink); border: 0; font-weight: 620; letter-spacing: 0.01em;
        background: linear-gradient(180deg, #e6cd97, #cfab61);
      }
      button.solid:hover { filter: brightness(1.06); }

      .note {
        margin-top: 13px; font-size: 13px; color: var(--warn);
        background: rgba(217, 185, 120, 0.07); border-left: 2px solid rgba(217, 185, 120, 0.45);
        border-radius: 0 6px 6px 0; padding: 9px 13px;
      }
      .links { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 15px; align-items: center; }
      .links a {
        font-size: 13.5px; color: var(--text); text-decoration: none; padding: 8px 13px;
        border: 1px solid var(--border); border-radius: 9px; background: var(--panel);
      }
      .links a:hover { border-color: rgba(217, 185, 120, 0.5); color: var(--accent); }

      /* ---------- form ---------- */
      fieldset { border: 0; margin: 0 0 24px; padding: 0; }
      .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; align-items: start; }
      /* Two columns of 14px labels do not fit a phone; stack them rather than shrink. */
      @media (max-width: 560px) { .fields { grid-template-columns: 1fr; } }
      .field { display: grid; align-content: start; gap: 6px; min-width: 0; }
      .field.wide { grid-column: 1 / -1; }
      .field > span { font-size: 13.5px; color: var(--text); font-weight: 500; }
      .field small { font-size: 12.2px; color: var(--faint); line-height: 1.45; }

      input[type="number"], select {
        width: 100%; min-width: 0; padding: 9px 11px; font: inherit; font-size: 14.5px;
        font-variant-numeric: tabular-nums; color: var(--text);
        background: rgba(8, 8, 10, 0.72); border: 1px solid var(--border);
        border-radius: 8px; outline: none; transition: border-color .15s, box-shadow .15s;
      }
      select { appearance: none; cursor: pointer; padding-right: 28px;
        background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
                          linear-gradient(135deg, var(--muted) 50%, transparent 50%);
        background-position: right 13px top 18px, right 8px top 18px;
        background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
      input[type="number"]:focus, select:focus {
        border-color: rgba(217, 185, 120, 0.55); box-shadow: 0 0 0 3px rgba(217, 185, 120, 0.12);
      }
      .slider-row { display: grid; grid-template-columns: 1fr 74px; gap: 10px; align-items: center; }
      input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }

      /* ---------- docs ---------- */
      .doc-title {
        font-family: var(--serif); font-size: 24px; font-weight: 600;
        margin: 0 0 5px; letter-spacing: 0.005em;
      }
      .doc-tagline { color: var(--muted); font-size: 15.5px; margin: 0 0 18px; }
      .callout {
        font-size: 14px; color: var(--muted); background: rgba(217, 185, 120, 0.06);
        border-left: 2px solid rgba(217, 185, 120, 0.45); border-radius: 0 7px 7px 0;
        padding: 11px 15px; margin: 0 0 20px;
      }
      .callout b { color: var(--text); font-weight: 600; }
      .doc h4 {
        font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.13em;
        color: var(--faint); font-weight: 650; margin: 22px 0 11px;
      }
      .doc ol, .doc ul { margin: 0; padding-left: 22px; }
      .doc li { font-size: 14.5px; color: var(--muted); margin-bottom: 9px; line-height: 1.62; }
      .doc ol li::marker { color: var(--accent); font-weight: 640; }
      .refs { list-style: none; padding: 0; }
      .refs li { margin-bottom: 11px; font-size: 13px; line-height: 1.55; }
      .refs a { color: var(--accent); text-decoration: none; }
      .refs a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <nav class="appbar">
      <div class="brand"><span class="mark"></span><b>RDK Studio</b></div>
      <div class="tabs" id="tabs" role="tablist" aria-label="RDK method"></div>
      <div class="bar-right">
        <span class="pill" id="status" data-state="busy"><span class="dot"></span><span id="status-text">starting</span></span>
        <button class="icon-btn" id="shuffle" type="button" title="Random seed">&#8635;</button>
      </div>
    </nav>

    <div class="wrap">
      <div class="grid">
        <form class="card" method="post" action="/generate" id="form">
          <input type="hidden" name="method" id="method-input" value="{{ selected }}" />
          <div id="fields"></div>
          <button class="solid" type="submit" style="width:100%">Export .mp4 + frames</button>
        </form>

        <div class="stack">
          <section class="card">
            <p class="section-title">Live preview</p>
            <div class="stage" id="stage">
              <canvas id="canvas" width="512" height="512"></canvas>
            </div>
            <div class="transport">
              <button class="ghost" id="play" type="button">Pause</button>
              <span class="stats" id="stats"></span>
              <span class="grow"></span>
            </div>
            <div class="note" id="trunc" hidden></div>

            {% if mp4_url %}
              <div class="links">
                <a href="{{ mp4_url }}">Download .mp4</a>
                <a href="{{ zip_url }}">Frames (.zip)</a>
                <a href="/meta/{{ job_id }}">Params (.json)</a>
                {% if preview_method %}<span class="pill">last export: {{ preview_method }}</span>{% endif %}
              </div>
            {% endif %}
          </section>

          <section class="card doc" id="doc"></section>
        </div>
      </div>
    </div>

    <script>
      const METHODS = {{ methods_json|safe }};
      const SAVED = {{ saved_json|safe }};
      const GROUP_ORDER = {{ group_order|tojson }};
      const GROUP_LABELS = {{ group_labels|tojson }};

      const byId = Object.fromEntries(METHODS.map((m) => [m.id, m]));
      let currentId = byId[{{ selected|tojson }}] ? {{ selected|tojson }} : METHODS[0].id;

      const form = document.getElementById("form");
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d", { alpha: false });

      const esc = (s) =>
        String(s).replace(/[&<>"']/g, (c) =>
          ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]
        );

      /* ---------------- form ---------------- */

      function valueFor(method, param) {
        const saved = SAVED[method.id];
        if (saved && Object.prototype.hasOwnProperty.call(saved, param.name)) return saved[param.name];
        return param.default;
      }

      function attrs(p) {
        const bits = [];
        if (p.min !== null) bits.push(`min="${p.min}"`);
        if (p.max !== null) bits.push(`max="${p.max}"`);
        if (p.step !== null) bits.push(`step="${p.step}"`);
        return bits.join(" ");
      }

      function fieldHtml(method, p) {
        const value = valueFor(method, p);
        const help = p.help ? `<small>${esc(p.help)}</small>` : "";
        let control;

        if (p.kind === "choice") {
          const opts = p.choices
            .map((c) => `<option value="${esc(c.value)}"${c.value === value ? " selected" : ""}>${esc(c.label)}</option>`)
            .join("");
          control = `<select name="${p.name}">${opts}</select>`;
        } else if (p.kind === "float" && p.min !== null && p.max !== null) {
          control =
            `<div class="slider-row">` +
            `<input type="range" ${attrs(p)} value="${esc(value)}" data-sync="${p.name}" />` +
            `<input type="number" name="${p.name}" ${attrs(p)} value="${esc(value)}" /></div>`;
        } else {
          control = `<input type="number" name="${p.name}" ${attrs(p)} value="${esc(value)}" />`;
        }
        return `<label class="field${p.kind === "choice" ? " wide" : ""}"><span>${esc(p.label)}</span>${control}${help}</label>`;
      }

      function renderTabs() {
        document.getElementById("tabs").innerHTML = METHODS.map(
          (m) =>
            `<button type="button" role="tab" class="tab${m.canonical ? "" : " is-ours"}" ` +
            `data-id="${m.id}" aria-selected="${m.id === currentId}" title="${esc(m.tagline)}">` +
            `<span class="chip">${esc(m.short)}</span>${esc(m.tab)}</button>`
        ).join("");
      }

      function renderFields() {
        const method = byId[currentId];
        document.getElementById("fields").innerHTML = GROUP_ORDER.map((g) => {
          const params = method.params.filter((p) => p.group === g);
          if (!params.length) return "";
          return (
            `<fieldset><p class="section-title">${esc(GROUP_LABELS[g])}</p>` +
            `<div class="fields">${params.map((p) => fieldHtml(method, p)).join("")}</div></fieldset>`
          );
        }).join("");
        document.getElementById("method-input").value = currentId;

        document.querySelectorAll("input[data-sync]").forEach((range) => {
          const number = range.parentElement.querySelector('input[type="number"]');
          range.addEventListener("input", () => { number.value = range.value; schedule(); });
          number.addEventListener("input", () => { range.value = number.value; });
        });
      }

      function renderDoc() {
        const m = byId[currentId];
        const li = (xs) => xs.map((s) => `<li>${esc(s)}</li>`).join("");
        const refs = m.references
          .map((r) => `<li><a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.citation)}</a></li>`)
          .join("");
        document.getElementById("doc").innerHTML =
          `<h3 class="doc-title">${esc(m.label)}</h3>` +
          `<p class="doc-tagline">${esc(m.tagline)}</p>` +
          `<p class="callout"><b>Noise rule.</b> ${esc(m.noise_rule)}</p>` +
          `<h4>How each frame is generated</h4><ol>${li(m.steps)}</ol>` +
          (m.notes.length ? `<h4>Notes</h4><ul>${li(m.notes)}</ul>` : "") +
          (refs ? `<h4>References</h4><ul class="refs">${refs}</ul>` : "");
      }

      /* ---------------- live preview ---------------- */

      let clip = null;
      let frameIdx = 0;
      let playing = true;
      let dirty = false;
      let timer = null;
      let inflight = null;

      function setStatus(state, text) {
        const pill = document.getElementById("status");
        pill.dataset.state = state;
        document.getElementById("status-text").textContent = text;
      }

      function decodeF32(b64) {
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return new Float32Array(bytes.buffer);
      }

      function schedule(delay = 220) {
        setStatus("busy", "updating");
        clearTimeout(timer);
        timer = setTimeout(fetchPreview, delay);
      }

      async function fetchPreview() {
        if (inflight) inflight.abort();
        inflight = new AbortController();
        try {
          const res = await fetch("/api/preview", {
            method: "POST",
            body: new FormData(form),
            signal: inflight.signal,
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const d = await res.json();

          clip = {
            frames: d.n_frames, dots: d.n_dots, fps: d.fps,
            w: d.width, h: d.height, bg: d.background,
            radius: Math.max(0.5, d.dot_size / 2),
            cx: d.center[0], cy: d.center[1],
            xy: decodeF32(d.xy), alpha: decodeF32(d.alpha), lum: decodeF32(d.lum),
          };
          canvas.width = d.width;
          canvas.height = d.height;
          frameIdx = 0;
          dirty = true;

          document.getElementById("stats").innerHTML =
            `<b>${d.n_frames}</b> frames &middot; <b>${d.fps}</b> fps &middot; <b>${d.n_dots}</b> dots`;
          const note = document.getElementById("trunc");
          note.hidden = !d.truncated;
          if (d.truncated) {
            note.textContent =
              `Preview shows the first ${d.n_frames} of ${d.total_frames} frames. ` +
              `Exports always use the full duration.`;
          }
          setStatus("ok", "live");
        } catch (err) {
          if (err.name === "AbortError") return;   // superseded by a newer request
          setStatus("error", "preview failed");
        }
      }

      const shade = (v) => {
        const n = Math.max(0, Math.min(255, Math.round(v * 255)));
        return `rgb(${n},${n},${n})`;
      };

      function drawFrame(i) {
        const c = clip;
        ctx.fillStyle = shade(c.bg);
        ctx.fillRect(0, 0, c.w, c.h);

        // Mirrors FrameRenderer: field-centred, y-up coordinates into pixel space.
        const ox = c.w / 2 + c.cx;
        const oy = c.h / 2 - c.cy;
        const base = i * c.dots * 2;
        const baseA = i * c.dots;

        for (let d = 0; d < c.dots; d++) {
          const a = c.alpha[baseA + d];
          ctx.fillStyle = shade(c.bg * (1 - a) + c.lum[d] * a);
          ctx.beginPath();
          ctx.arc(ox + c.xy[base + d * 2], oy - c.xy[base + d * 2 + 1], c.radius, 0, 6.283185307);
          ctx.fill();
        }
      }

      let last = 0;
      let acc = 0;
      function loop(ts) {
        if (clip) {
          if (playing) {
            if (last) {
              acc += ts - last;
              const spf = 1000 / clip.fps;
              while (acc >= spf) {
                acc -= spf;
                frameIdx = (frameIdx + 1) % clip.frames;
                dirty = true;
              }
            }
            last = ts;
          } else {
            last = 0;
          }
          if (dirty) { drawFrame(frameIdx); dirty = false; }
        }
        requestAnimationFrame(loop);
      }

      /* ---------------- wiring ---------------- */

      function select(id) {
        if (!byId[id] || id === currentId) return;
        currentId = id;
        renderTabs();
        renderFields();
        renderDoc();
        schedule(0);
      }

      document.getElementById("tabs").addEventListener("click", (e) => {
        const tab = e.target.closest(".tab");
        if (tab) select(tab.dataset.id);
      });

      // Any parameter edit re-simulates; no need to press anything.
      form.addEventListener("input", (e) => {
        if (e.target.type !== "range") schedule();
      });
      form.addEventListener("change", () => schedule());

      document.getElementById("play").addEventListener("click", (e) => {
        playing = !playing;
        e.target.textContent = playing ? "Pause" : "Play";
      });

      document.getElementById("shuffle").addEventListener("click", () => {
        const seed = form.elements.seed;
        if (seed) { seed.value = Math.floor(Math.random() * 100000); schedule(0); }
      });

      renderTabs();
      renderFields();
      renderDoc();
      requestAnimationFrame(loop);
      fetchPreview();
    </script>
  </body>
</html>
